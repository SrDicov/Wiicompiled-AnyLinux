name: Package installers

# Builds the per-platform installer/setup tool (WiiCompiled-Setup.exe /
# WiiCompiled-Setup-x86_64.AppImage) via Launcher/Build-Installer.ps1 and
# Launcher/build-appimage.sh respectively - the same scripts a maintainer runs by hand today to
# produce a GitHub Release asset. This does NOT build the actual translated game executable:
# that step requires the end user's own Mario Kart Wii dump (Assets/main.dol, Assets/StaticR.rel),
# which is proprietary and not present in this repository or in CI.
on:
  push:
    tags:
      - '*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: package-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  recompilation:
    name: Recompilation test
    # qa-matrix-* tags exercise already-built artifacts; they must not spend
    # Windows runners recompiling the world again.
    if: ${{ !startsWith(github.ref, 'refs/tags/qa-matrix-') }}
    uses: ./.github/workflows/recomp-test.yml

  linux-appimage:
    name: Linux (AppImage, ${{ matrix.arch }})
    # See above: qa-matrix-* tags only run the QA matrix workflow.
    if: ${{ !startsWith(github.ref, 'refs/tags/qa-matrix-') }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            arch: x86_64
          - runner: ubuntu-22.04-arm
            arch: aarch64
    runs-on: ${{ matrix.runner }}
    # AnyLinux method: the image bundles its own glibc, so it MUST be built
    # on Arch (fresh glibc + the /usr/lib layout quick-sharun expects).
    # Ubuntu/Fedora hosts produce images that are NOT portable - see
    # Launcher/build-appimage.sh's ALLOW_NON_ARCH_BUILD guard.
    container: ghcr.io/pkgforge-dev/archlinux:latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # Arch no longer packages a .NET 8 SDK, and the build needs exactly that
      # (global.json / TargetFramework net8.0), so the SDK comes from
      # Microsoft's install script into /usr/share/dotnet instead of pacman.
      # NOTE: git must be installed here first - the bare Arch container ships
      # without it, so even `git config` (safe.directory for the checkout
      # volume) cannot run before this step.
      - name: Install build dependencies
        run: |
          # SDL3 (vendored by aurora, built from source during the
          # native-prebuilt harvest) needs its full X11/Wayland/audio
          # header closure or its configure FATALS on the first missing
          # piece. List mirrors the official Arch sdl3 PKGBUILD
          # depends+makedepends, plus dbus/udev/X11-extras aurora wants.
          pacman -Syu --noconfirm \
            base-devel git curl wget python patchelf file unzip \
            pkgconf xorg-server-xvfb icu openssl zlib gawk grep sed findutils \
            clang cmake ninja \
            alsa-lib jack wayland-protocols wayland mesa libpulse libxrandr \
            libxinerama libxkbcommon ibus libxss pipewire libdecor \
            vulkan-headers sndio libxext libxrender libx11 libgl libxcursor \
            hidapi libusb dbus systemd-libs libxi libxfixes libxtst libxcb \
            libdrm libglvnd libthai liburing xorgproto
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          curl -fsSL https://dot.net/v1/dotnet-install.sh -o /tmp/dotnet-install.sh
          bash /tmp/dotnet-install.sh --channel 8.0 --install-dir /usr/share/dotnet --no-path
          echo "/usr/share/dotnet" >> "$GITHUB_PATH"
          echo "DOTNET_ROOT=/usr/share/dotnet" >> "$GITHUB_ENV"
          echo "DOTNET_CLI_TELEMETRY_OPTOUT=1" >> "$GITHUB_ENV"
          echo "DOTNET_NOLOGO=1" >> "$GITHUB_ENV"
          /usr/share/dotnet/dotnet --list-sdks

      - name: Build AppImage
        run: bash Launcher/build-appimage.sh

      # Asset-free validation that the harvested native-prebuilt package is
      # consumable (include tokens resolve, Dawn config + cryptopp archive
      # present). Needs no game dump: products stay disabled.
      - name: Smoke-test native-prebuilt consumption
        run: |
          cmake -S runtime -B /tmp/np-smoke -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ \
            "-DMKW_NATIVE_PREBUILT_DIR=$GITHUB_WORKSPACE/Launcher/artifacts/native-prebuilt-${{ matrix.arch }}" \
            -DMKW_BUILD_PRODUCTS=OFF

      - uses: actions/upload-artifact@v7
        with:
          name: WiiCompiled-Setup-linux-${{ matrix.arch }}
          path: Launcher/dist/WiiCompiled-Setup-${{ matrix.arch }}.AppImage
          if-no-files-found: error
          archive: false

  windows-installer:
    name: Windows (installer exe)
    # See recompilation job: qa-matrix-* tags only run the QA matrix workflow.
    if: ${{ !startsWith(github.ref, 'refs/tags/qa-matrix-') }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'

      - name: Build installer
        shell: pwsh
        run: ./Launcher/Build-Installer.ps1

      - uses: actions/upload-artifact@v7
        with:
          name: WiiCompiled-Setup-windows-x64
          path: Launcher/dist/WiiCompiled-Setup.exe
          if-no-files-found: error
          archive: false

  # Publishes the packaged installers as a GitHub Release whenever a v* tag is pushed. Wheel Wizard
  # discovers updates from these releases, so the contract it relies on is enforced here: a full
  # (non-prerelease) release whose tag is v<semver>, carrying an asset named exactly
  # WiiCompiled-Setup.exe, produced by a setup host that reports that same version.
  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux-appimage, windows-installer, recompilation]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # Wheel Wizard runs the downloaded setup with --version and refuses it when the reported
      # version differs from the release tag, so a tag that was pushed without bumping every pinned
      # version would ship an update nobody can install. Catch that before anything is published.
      - name: Verify the tag matches the pinned setup version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          status=0
          check() {
            if ! grep -Fq "$2" "$1"; then
              echo "::error file=$1::expected '$2' for tag $TAG"
              status=1
            fi
          }
          check Launcher/WiiCompiled.Setup.Windows/Program.cs "public const string Version = \"$version\";"
          check Launcher/WiiCompiled.Setup.Windows/WiiCompiled.Setup.Windows.csproj "<Version>$version</Version>"
          check Launcher/Build-Installer.ps1 "ProductVersion = '$version'"
          exit $status

      # The build jobs upload with `archive: false`, which stores each installer as a raw file
      # rather than a zip (and names the artifact after the file). Only download-artifact v8 and
      # later understand such direct uploads; v7 tries to unzip everything and fails on them.
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          ls -lR artifacts
          assets=()
          for name in WiiCompiled-Setup.exe WiiCompiled-Setup-x86_64.AppImage WiiCompiled-Setup-aarch64.AppImage; do
            found="$(find artifacts -type f -name "$name" | head -n 1)"
            [ -n "$found" ] && [ -s "$found" ] || { echo "::error::missing release asset $name"; exit 1; }
            assets+=("$found")
          done
          # A re-run of a tag whose release already exists only refreshes the assets.
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" "${assets[@]}" --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$TAG" "${assets[@]}" \
              --repo "$GITHUB_REPOSITORY" \
              --title "$TAG" \
              --verify-tag \
              --generate-notes
          fi
